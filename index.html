<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Meter</title>

    <link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="container">

    <h1>🎂 Happy Birthday 🎂</h1>

    <div class="meter-container">
        <div id="meter-fill"></div>
    </div>

    <div id="percentage">0%</div>

    <button id="startBtn">
        🎤 Start Listening
    </button>

    <div id="lastPhrase">
        Waiting...
    </div>

    <div class="debug-panel">

        <div><b>Browser:</b> <span id="browserInfo"></span></div>
        <div><b>Protocol:</b> <span id="protocolInfo"></span></div>
        <div><b>Speech API:</b> <span id="speechSupport"></span></div>
        <div><b>Microphone:</b> <span id="micStatus"></span></div>
        <div><b>Recognition:</b> <span id="recognitionStatus"></span></div>
        <div><b>Error:</b> <span id="errorStatus"></span></div>
        <div><b>Volume:</b> <span id="volumeValue">0</span></div>
        <div><b>Recognitions:</b> <span id="recognizedCount">0</span></div>

    </div>

    <div id="logPanel"></div>

</div>

<script>

// ========================================
// DEBUG
// ========================================

alert("INLINE SCRIPT LOADED");

window.onerror = function(
    message,
    source,
    line,
    column,
    error
){

    alert(
        "JS ERROR: " +
        message +
        " line " +
        line
    );

    return false;
};

// ========================================
// ELEMENTS
// ========================================

const meterFill =
    document.getElementById("meter-fill");

const percentageText =
    document.getElementById("percentage");

const lastPhrase =
    document.getElementById("lastPhrase");

const startBtn =
    document.getElementById("startBtn");

let currentVolume = 0;
let meterValue = 0;
let recognizedCount = 0;

// ========================================
// LOGGING
// ========================================

function log(message){

    console.log(message);

    const panel =
        document.getElementById("logPanel");

    const row =
        document.createElement("div");

    row.innerText =
        new Date().toLocaleTimeString() +
        " - " +
        message;

    panel.prepend(row);
}

function setDebug(id,value){

    const el =
        document.getElementById(id);

    if(el){

        el.innerText = value;
    }
}

// ========================================
// METER
// ========================================

function updateMeter(points){

    meterValue += points;

    if(meterValue > 100){

        meterValue = 100;
    }

    meterFill.style.height =
        meterValue + "%";

    percentageText.innerText =
        Math.round(meterValue) + "%";
}

function calculateGain(base){

    const noiseFloor = 0.02;

    const volume =
        Math.max(
            0,
            currentVolume - noiseFloor
        );

    const multiplier =
        1 + Math.pow(volume * 12,2);

    return base * multiplier;
}

// ========================================
// DIAGNOSTICS
// ========================================

function initializeDiagnostics(){

    setDebug(
        "browserInfo",
        navigator.userAgent
    );

    setDebug(
        "protocolInfo",
        location.protocol
    );

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    setDebug(
        "speechSupport",
        SpeechRecognition
            ? "SUPPORTED"
            : "NOT SUPPORTED"
    );

    log("Page initialized");
    log("Protocol: " + location.protocol);
    log("UserAgent: " + navigator.userAgent);
}

// ========================================
// MICROPHONE
// ========================================

async function setupMicrophone(){

    try{

        log("Requesting microphone");

        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio:{
                    noiseSuppression:true,
                    echoCancellation:true,
                    autoGainControl:false
                }
            });

        setDebug(
            "micStatus",
            "GRANTED"
        );

        log("Microphone granted");

        const audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        const source =
            audioContext.createMediaStreamSource(
                stream
            );

        const analyser =
            audioContext.createAnalyser();

        analyser.fftSize = 2048;

        source.connect(analyser);

        const dataArray =
            new Uint8Array(
                analyser.fftSize
            );

        function monitor(){

            analyser.getByteTimeDomainData(
                dataArray
            );

            let sumSquares = 0;

            for(
                let i=0;
                i<dataArray.length;
                i++
            ){

                const sample =
                    (dataArray[i]-128)/128;

                sumSquares +=
                    sample * sample;
            }

            currentVolume =
                Math.sqrt(
                    sumSquares /
                    dataArray.length
                );

            setDebug(
                "volumeValue",
                currentVolume.toFixed(4)
            );

            requestAnimationFrame(
                monitor
            );
        }

        monitor();

    }catch(err){

        setDebug(
            "micStatus",
            "DENIED"
        );

        log(
            "Microphone error: " +
            err.message
        );

        throw err;
    }
}

// ========================================
// SPEECH RECOGNITION
// ========================================

function startRecognition(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        log(
            "SpeechRecognition unavailable"
        );

        return;
    }

    const recognition =
        new SpeechRecognition();

    recognition.lang = "en-US";
    recognition.continuous = false;
    recognition.interimResults = true;

    recognition.onstart = () => {

        setDebug(
            "recognitionStatus",
            "STARTED"
        );

        log(
            "Recognition started"
        );
    };

    recognition.onaudiostart =
        () => log("Audio start");

    recognition.onspeechstart =
        () => log("Speech start");

    recognition.onspeechend =
        () => log("Speech end");

    recognition.onaudioend =
        () => log("Audio end");

    recognition.onresult = (event) => {

        recognizedCount++;

        setDebug(
            "recognizedCount",
            recognizedCount
        );

        let transcript = "";

        for(
            let i=event.resultIndex;
            i<event.results.length;
            i++
        ){

            transcript +=
                event.results[i][0].transcript +
                " ";
        }

        transcript =
            transcript
                .toLowerCase()
                .trim();

        lastPhrase.innerText =
            transcript;

        log(
            "Transcript: " +
            transcript
        );

        const normalized =
            transcript
                .replace(/[^\w\s]/g,"")
                .trim();

        if(
            normalized.includes(
                "happy birthday"
            )
        ){

            const gain =
                calculateGain(1);

            log(
                "Happy Birthday +" +
                gain.toFixed(2)
            );

            updateMeter(gain);
        }

        if(
            normalized.includes(
                "i love you"
            )
        ){

            const gain =
                calculateGain(2);

            log(
                "I Love You +" +
                gain.toFixed(2)
            );

            updateMeter(gain);
        }
    };

    recognition.onerror = (event) => {

        setDebug(
            "errorStatus",
            event.error
        );

        log(
            "ERROR: " +
            event.error
        );
    };

    recognition.onend = () => {

        setDebug(
            "recognitionStatus",
            "RESTARTING"
        );

        log(
            "Recognition ended"
        );

        setTimeout(() => {

            try{

                recognition.start();

            }catch(e){

                log(
                    "Restart failed: " +
                    e.message
                );
            }

        },500);
    };

    recognition.start();
}

// ========================================
// START
// ========================================

startBtn.addEventListener(
    "click",
    async () => {

        try{

            await setupMicrophone();

            startRecognition();

            startBtn.disabled = true;

            log(
                "System started"
            );

        }catch(err){

            alert(
                "Microphone access failed"
            );
        }
    }
);

initializeDiagnostics();

</script>

</body>
</html>
