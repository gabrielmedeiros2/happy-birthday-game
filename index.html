<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Birthday Meter Debug</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

    <h1>🎂 Birthday Meter 🎂</h1>

    <div class="meter-container">
        <div id="meter-fill"></div>
    </div>

    <div id="percentage">0%</div>

    <button id="startBtn">
        🎤 Start Listening
    </button>

    <h3>Last Transcript</h3>

    <div id="lastPhrase">
        Waiting...
    </div>

    <h3>Diagnostics</h3>

    <div class="debug-panel">

        <div>
            <b>Browser:</b>
            <span id="browserInfo"></span>
        </div>

        <div>
            <b>Protocol:</b>
            <span id="protocolInfo"></span>
        </div>

        <div>
            <b>SpeechRecognition:</b>
            <span id="speechSupport"></span>
        </div>

        <div>
            <b>Microphone:</b>
            <span id="micStatus"></span>
        </div>

        <div>
            <b>Recognition State:</b>
            <span id="recognitionStatus"></span>
        </div>

        <div>
            <b>Last Error:</b>
            <span id="errorStatus"></span>
        </div>

        <div>
            <b>Volume:</b>
            <span id="volumeValue">0</span>
        </div>

        <div>
            <b>Recognized Count:</b>
            <span id="recognizedCount">0</span>
        </div>

    </div>

    <h3>Live Log</h3>

    <div id="logPanel"></div>

</div>

<script src="script.js"></script>

</body>
</html>
