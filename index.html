<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Meter</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

    <h1>🎂 Happy Birthday! 🎉</h1>

    <div class="meter-container">
        <div id="meter-fill"></div>
    </div>

    <div class="percentage" id="percentage">
        0%
    </div>

    <button id="startBtn">
        🎤 Start Listening
    </button>

    <div class="status">
        <p><strong>Last phrase:</strong></p>
        <p id="lastPhrase">
            Waiting...
        </p>
    </div>

</div>

<script>

const meterFill =
    document.getElementById(
        "meter-fill"
    );

const percentageText =
    document.getElementById(
        "percentage"
    );

const lastPhrase =
    document.getElementById(
        "lastPhrase"
    );

const startBtn =
    document.getElementById(
        "startBtn"
    );

let meterValue = 0;

// ========================================
// Meter
// ========================================

function updateMeter(amount){

    meterValue += amount;

    if(meterValue > 100){
        meterValue = 100;
    }

    meterFill.style.height =
        meterValue + "%";

    percentageText.innerText =
        Math.round(meterValue) + "%";
}

// ========================================
// Phrase Scoring
// ========================================

function calculateGain(
    basePoints,
    confidence
){

    const score =
        confidence > 0
            ? confidence
            : 0.7;

    return basePoints * (
        1 + score * 4
    );
}

// ========================================
// Speech Recognition
// ========================================

function startRecognition(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        alert(
            "Speech Recognition is not supported on this browser."
        );

        return;
    }

    const recognition =
        new SpeechRecognition();

    recognition.lang = "en-US";

    recognition.continuous = false;

    recognition.interimResults = true;

    recognition.maxAlternatives = 10;

    recognition.onresult = (event) => {

        let transcript = "";

        let confidence = 0;

        for(
            let i=0;
            i<event.results.length;
            i++
        ){

            transcript +=
                event.results[i][0]
                    .transcript
                + " ";

            confidence =
                Math.max(
                    confidence,
                    event.results[i][0]
                        .confidence || 0
                );
        }

        transcript =
            transcript
                .toLowerCase()
                .trim();

        lastPhrase.innerText =
            transcript;

        const normalized =
            transcript
                .replace(/[^\w\s]/g,"")
                .replace(/\s+/g," ")
                .trim();

        // Happy Birthday

        if(
            normalized.includes(
                "happy birthday"
            )
        ){

            updateMeter(
                calculateGain(
                    2,
                    confidence
                )
            );
        }

        // I Love You

        if(
            normalized.includes(
                "i love you"
            )
        ){

            updateMeter(
                calculateGain(
                    4,
                    confidence
                )
            );
        }
    };

    recognition.onerror = (event) => {

        console.log(
            "Recognition error:",
            event.error
        );
    };

    recognition.onend = () => {

        setTimeout(() => {

            try{

                recognition.start();

            }catch(err){

                console.log(err);
            }

        },300);
    };

    recognition.start();
}

// ========================================
// Start
// ========================================

startBtn.addEventListener(
    "click",
    async () => {

        try{

            // Request permission once
            const stream =
                await navigator.mediaDevices
                    .getUserMedia({
                        audio:true
                    });

            // Release immediately
            stream.getTracks()
                .forEach(track =>
                    track.stop()
                );

            startRecognition();

            startBtn.disabled = true;

            startBtn.innerText =
                "🎤 Listening...";

        }catch(err){

            console.error(err);

            alert(
                "Could not access microphone."
            );
        }
    }
);

</script>

</body>
</html>
