<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Meter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="container-game" class="container">

    <h1>🎂 Happy Birthday! 🎉</h1>

    <div class="timer-bar-grid">
        <div id="turnCountdown">15s</div>
        <div class="meter-wrapper">
            <div class="meter-label" id="meter-total">&#8369; 8,000</div>
            <div class="meter-area">
                <div class="meter-container">
                    <div id="meter-fill"></div>
                </div>
                <div class="meter-tracker" id="meter-tracker">
                    <div class="tracker-line"></div>
                    <div class="tracker-amount" id="percentage">&#8369; 0</div>
                </div>
            </div>
        </div>
        <div></div>
    </div>

    <div id="turnInfo">
        Coleen's turn
    </div>

    <div id="boostIndicator">🚀 2X BOOST</div>
    <div id="boostTimer"></div>

    <button id="startBtn">🎤 Start Listening</button>

    <div class="status">
        <p class="text-phrase"><strong>Last phrase:</strong></p>
        <div id="lastPhrase">Waiting...</div>
    </div>

</div>

<div id="container-victory" class="container invisible">
    <div id="victoryMessage">
        <span>Happy Birthday!</span><br/>
        <span id="victoryVerb">You won</span><br/>
        <strong class="victory-amount" id="victoryAmount">&#8369;20,000</strong>
    </div>
</div>

<div id="gameOverOverlay" class="game-over-overlay invisible">
    <div class="game-over-content">
        <div class="game-over-title">Game Over</div>
        <div class="game-over-amount" id="gameOverAmount">You won ₱0</div>
        <div class="game-over-sub">Click below to claim your birthday gift</div>
        <button id="claimBtn" class="claim-btn">Claim</button>
    </div>
</div>

<button id="testGameOverBtn" class="test-btn">⚡ Test Game Over</button>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<!-- CELEBRATION AUDIO - Remove this block when done testing -->
<audio id="sndPop" preload="auto">
    <source src="https://raw.githubusercontent.com/Aurosish07/BirthDayCake/master/balloonpop-83760.mp3" type="audio/mpeg">
</audio>
<audio id="sndApplause" preload="auto">
    <source src="https://raw.githubusercontent.com/Sirsha2468/Dev-Geeks/main/Js-Projects/Sound%20Board/sounds/applause.mp3" type="audio/mpeg">
</audio>
<audio id="sndCheer" preload="auto">
    <source src="https://raw.githubusercontent.com/Aurosish07/BirthDayCake/master/song.mp3" type="audio/mpeg">
</audio>
<audio id="sndSuspense" loop preload="auto">
    <source src="https://raw.githubusercontent.com/code4fukui/drumroll/main/569113__missloonervoiceover255__long-snare-drum-roll-with-cymbal-crash.mp3" type="audio/mpeg">
</audio>
<audio id="sndCountdown" preload="auto">
    <source src="countdown.mp3" type="audio/mpeg">
</audio>
<!-- END CELEBRATION AUDIO -->
<script>
const meterFill=document.getElementById("meter-fill");
const percentageText=document.getElementById("percentage");
const meterTracker=document.getElementById("meter-tracker");
const lastPhrase=document.getElementById("lastPhrase");
const startBtn=document.getElementById("startBtn");
const boostIndicator=document.getElementById("boostIndicator");
const boostTimer=document.getElementById("boostTimer");
const volumeDebug=document.getElementById("volumeDebug");
const containerGame=document.getElementById("container-game");
const containerVictory=document.getElementById("container-victory");
const gameOverOverlay=document.getElementById("gameOverOverlay");
const gameOverAmount=document.getElementById("gameOverAmount");
const victoryVerb=document.getElementById("victoryVerb");
const victoryAmountEl=document.getElementById("victoryAmount");
const claimBtn=document.getElementById("claimBtn");
const testGameOverBtn=document.getElementById("testGameOverBtn");

const meterMax = 8000;
const totalTurns = 8;
const turnDurationMs = 15000;
const turnCap = meterMax / totalTurns;
const names = ["Coleen", "Macmac", "Therese", "Leda", "Joseph", "Arvin", "Minnie", "Carlou"];

let currentTurn = 1;
let turnTimer = null;
let turnRunning = false;

let meterValue=0;
let recognition=null;
let gameFinished=false;
let currentVolume=0;
let boostActive=false;
let boostTimeout=null;
let boostInterval=null;
let fireworksInterval=null;
let recentVolumes = [];
let simulatedVolume = 0.5;
let fromGameOver = false;

function formatAmount(val){
    return Math.round(val).toLocaleString("en-US");
}

function updateMeter(amount){
    if(gameFinished) return;
    const turnLimit = getCurrentTurnLimit();
    meterValue += amount;

    if(meterValue > turnLimit){
        meterValue = turnLimit;
        endTurn();
    }

    if(meterValue>=meterMax){
        meterValue=meterMax;
        const pct = (meterValue * 100)/meterMax;
        meterFill.style.height=pct+"%";
        meterTracker.style.bottom=pct+"%";
        percentageText.innerText="\u20B1 " + formatAmount(meterValue);
        setTimeout(triggerVictory, 500);
        return;
    }

    const pct = (meterValue * 100)/meterMax;
    meterFill.style.height=pct+"%";
    meterTracker.style.bottom=pct+"%";
    percentageText.innerText="\u20B1 " + formatAmount(meterValue);
}

function activateBoost(){
    boostActive=true;

    clearTimeout(boostTimeout);
    clearInterval(boostInterval);

    boostIndicator.classList.add("boost-active");
    boostIndicator.style.opacity="1";

    const startTime=Date.now();

    boostInterval=setInterval(()=>{
        const elapsed=Date.now()-startTime;
        const remaining=Math.max(0,15000-elapsed);


        const progress=remaining/15000;
        boostIndicator.style.fontSize=(1+(2*progress))+"rem";
    },100);

    boostTimeout=setTimeout(()=>{
        boostActive=false;
        boostIndicator.style.opacity="0";
        boostIndicator.classList.remove("boost-active");
        clearInterval(boostInterval);
    },15000);
}

async function startVolumeMonitor(){
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});

    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const source=ctx.createMediaStreamSource(stream);
    const analyser=ctx.createAnalyser();

    analyser.fftSize=2048;
    source.connect(analyser);

    const data=new Uint8Array(analyser.fftSize);

    function monitor(){
        analyser.getByteTimeDomainData(data);

        let sum=0;
        for(let i=0;i<data.length;i++){
            const sample=(data[i]-128)/128;
            sum+=sample*sample;
        }

        currentVolume=Math.sqrt(sum/data.length);
        volumeDebug.innerText="Volume: "+currentVolume.toFixed(3);

        if(!gameFinished){
            requestAnimationFrame(monitor);
        }
    }

    monitor();
}

function calculateGain(){
    const baseValue = 100;
    const avgConfidence =
        recentVolumes.length
            ? recentVolumes.reduce(
                (a,b) => a + b,
                0
              ) / recentVolumes.length
            : 0.5;

    let points =
        baseValue +
        (avgConfidence * 300);

    return points;
}

function startFireworks(){

    const duration = 3000;

    const end =
        Date.now() +
        duration;

    const interval =
        setInterval(() => {

            confetti({

                particleCount: 50,

                spread: 120,

                origin: {
                    x: 0.5,
                    y: 0.5
                }
            });

            if(
                Date.now() > end
            ){
                clearInterval(
                    interval
                );
            }

        },200);
}

function triggerVictory(){
    gameFinished=true;

    var cd = document.getElementById("sndCountdown");
    cd.pause();
    cd.currentTime = 0;

    boostActive=false;
    clearTimeout(boostTimeout);
    clearInterval(boostInterval);

    boostIndicator.style.opacity="0";
    boostTimer.innerText="";
    boostIndicator.classList.remove("boost-active");

    if(recognition){
        try{
            recognition.onend=null;
            recognition.stop();
        }catch(e){}
    }

    startBtn.style.display="none";

    if(fromGameOver){
        victoryVerb.innerText="You will receive";
    }else{
        victoryVerb.innerText="You won";
    }

    containerGame.classList.add("invisible");
    containerVictory.classList.remove("invisible");

    startFireworks();

    document.getElementById("victoryMessage")
            .classList.add("victory-visible");
}

function startRecognition(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

    if(!SR){
        alert("Speech Recognition is not supported.");
        return;
    }

    recognition=new SR();

    recognition.lang="en-US";
    recognition.continuous=false;
    recognition.interimResults=true;

    recognition.onresult=(event)=>{
        let transcript="";

        for(let i=0;i<event.results.length;i++){
            transcript+=event.results[i][0].transcript+" ";
        }

        transcript=transcript.toLowerCase().trim();
        lastPhrase.innerText=transcript;

        const normalized=transcript.replace(/[^\w\s]/g,"").replace(/\s+/g," ").trim();

        const confidence =
            event.results[event.results.length - 1][0]
                .confidence || 0.5;

        simulatedVolume = confidence;

        recentVolumes.push(confidence);

        if(recentVolumes.length > 20){
            recentVolumes.shift();
        }

        if(normalized.includes("i love you")){
            updateMeter(calculateGain() * 1.5);
            activateBoost();
            return;
        }

        if(normalized.includes("happy birthday")){
            updateMeter(calculateGain());
        }
    };

    recognition.onend=()=>{
        if(gameFinished) return;

        setTimeout(()=>{
            try{ recognition.start(); } catch(e){}
        },300);
    };

    recognition.start();
}

startBtn.addEventListener("click", async ()=>{
    if(turnRunning){
        return;
    }

    try{
        const stream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio:true
                });

        stream.getTracks()
            .forEach(track =>
                track.stop()
            );

        //startRecognition();

        startBtn.disabled = true;

        startBtn.innerText =
            "🎤 Listening...";

        document.getElementById(
            "turnCountdown"
        ).innerText =
            "15s";

        startTurn();

    }catch(err){

        alert(
            "Could not access microphone."
        );
    }
});

function getCurrentTurnLimit(){
    return turnCap * currentTurn;
}

function startTurn(){
    turnRunning = true;

    var cd = document.getElementById("sndCountdown");
    cd.pause();
    cd.currentTime = 0;

    const started =
        Date.now();

    turnTimer =
        setInterval(() => {

            const elapsed =
                Date.now() - started;

            const remaining =
                Math.max(
                    0,
                    turnDurationMs - elapsed
                );

            const secsLeft = Math.ceil(remaining / 1000);

            document.getElementById(
                "turnCountdown"
            ).innerText =
                secsLeft + "s";

            if(secsLeft <= 3 && cd.paused){
                cd.currentTime = 0;
                cd.volume = 1.0;
                cd.play();
            }

            if(
                remaining <= 0
            ){
                document.getElementById(
                    "turnCountdown"
                ).innerText = "0s";

                clearInterval(
                    turnTimer
                );

                endTurn();
            }

        },100);

    startRecognition();
}

function endTurn(){
    turnRunning = false;

    document.getElementById("turnCountdown").innerText = "0s";

    clearTimeout(turnTimer);
    clearInterval(turnTimer);

    boostActive = false;

    clearTimeout(boostTimeout);
    clearInterval(boostInterval);

    boostIndicator.style.opacity = "0";
    boostTimer.innerText = "";

    boostIndicator.classList.remove(
        "boost-active"
    );

    if(recognition){

        try{

            recognition.onend = null;

            recognition.stop();

        }catch(e){}
    }

    if(currentTurn < totalTurns){

        currentTurn++;

        document.getElementById(
            "turnInfo"
        ).innerText =
            `${names[currentTurn - 1]}'s turn`;

        startBtn.disabled = false;

        startBtn.innerText =
            `🎤 Start ${names[currentTurn - 1]}'s turn`;

    }else{

        if(meterValue < meterMax){
            startBtn.disabled = true;
            startBtn.innerText = "🎤 Game Over";
            showGameOver();
        }else{
            startBtn.disabled = false;
            startBtn.innerText = "🎤 Final Turn Complete";
        }
    }
}

function showGameOver(){
    gameOverAmount.innerText = "You won \u20B1" + formatAmount(meterValue);
    var suspense = document.getElementById("sndSuspense");
    suspense.pause();
    suspense.currentTime = 0;
    gameOverOverlay.classList.remove("invisible");
}

claimBtn.addEventListener("click", function(){
    gameOverOverlay.classList.add("invisible");
    var suspense = document.getElementById("sndSuspense");
    suspense.pause();
    suspense.currentTime = 0;
    fromGameOver = true;
    triggerVictory();
});

testGameOverBtn.addEventListener("click", function(){
    if(turnRunning){
        try{
            recognition.onend = null;
            recognition.stop();
        }catch(e){}
        turnRunning = false;
        clearInterval(turnTimer);
    }
    boostActive = false;
    clearTimeout(boostTimeout);
    clearInterval(boostInterval);
    meterValue = 3500;
    currentTurn = 8;
    document.getElementById("turnInfo").innerText = names[currentTurn - 1] + "'s turn";
    const pct = (meterValue * 100) / meterMax;
    meterFill.style.height = pct + "%";
    meterTracker.style.bottom = pct + "%";
    percentageText.innerText = "\u20B1 " + formatAmount(meterValue);
    containerGame.classList.remove("invisible");
    containerVictory.classList.add("invisible");
    document.getElementById("victoryMessage").classList.remove("victory-visible");
    gameFinished = false;
    startBtn.style.display = "";
    startBtn.disabled = false;
    startBtn.innerText = "\uD83C\uDFA4 Start " + names[currentTurn - 1] + "'s turn";
    endTurn();
    var s = document.getElementById("sndSuspense");
    s.pause();
    s.currentTime = 0;
});


/* CELEBRATION AUDIO - Remove this block when done testing */
function playCelebration(){
    var suspense = document.getElementById("sndSuspense");
    suspense.pause();
    suspense.currentTime = 0;
    var pop = document.getElementById("sndPop");
    var applause = document.getElementById("sndApplause");
    var cheer = document.getElementById("sndCheer");
    pop.volume = 1.0; pop.currentTime = 0; pop.play();
    setTimeout(function(){ applause.volume = 1.0; applause.currentTime = 0; applause.play(); }, 200);
    setTimeout(function(){ cheer.volume = 1.0; cheer.currentTime = 0; cheer.play(); }, 400);
}

const _origStartFireworks = startFireworks;
startFireworks = function(){
    _origStartFireworks();
    playCelebration();
};

const _origEndTurn = endTurn;
endTurn = function(){
    _origEndTurn();
    if(currentTurn >= 7 && !gameFinished){
        var suspense = document.getElementById("sndSuspense");
        suspense.currentTime = 0;
        suspense.play();
    }
};
/* END CELEBRATION AUDIO */
</script>
</body>
</html>
