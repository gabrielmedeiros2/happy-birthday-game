<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Meter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1>🎂 Happy Birthday! 🎉</h1>

        <div class="meter-container">
            <div id="meter-fill"></div>
        </div>

        <div class="percentage" id="percentage">0%</div>

        <button id="startBtn">🎤 Start Listening</button>

        <div class="status">
            <p><strong>Last phrase:</strong></p>
            <p id="lastPhrase">Waiting...</p>
        </div>

	<div id="volumeDebug">
    	    Volume: 0
	</div>

    <div style="margin-top:10px;font-size:12px;text-align:left;">
        <div><b>Recognition Status:</b> <span id="recognitionStatus">Idle</span></div>
        <div><b>Speech Detected:</b> <span id="speechDetected">No</span></div>
        <div><b>Audio Detected:</b> <span id="audioDetected">No</span></div>
        <div><b>Last Error:</b> <span id="lastError">None</span></div>
        <div><b>Raw Transcript:</b></div>
        <div id="rawTranscript" style="word-break:break-word;"></div>
    </div>

    </div>

    <script>
        const meterFill = document.getElementById("meter-fill");
        const percentageText = document.getElementById("percentage");
        const lastPhrase = document.getElementById("lastPhrase");
        const startBtn = document.getElementById("startBtn");

        let meterValue = 0;
        let currentVolume = 0;

        // =========================
        // Meter
        // =========================

        function updateMeter(amount) {

            meterValue += amount;

            if (meterValue > 100) {
                meterValue = 100;
            }

            meterFill.style.height = meterValue + "%";
            percentageText.innerText = meterValue.toFixed(0) + "%";
        }

        // =========================
        // Volume → Score Conversion
        // =========================

        function calculateGain(basePoints) {

            // Ignore background noise
            const noiseFloor = 0.03;

            let volume = Math.max(
                0,
                currentVolume - noiseFloor
            );

            /*
            * Exponential growth:
            * whisper ≈ 1x
            * normal ≈ 3-5x
            * loud ≈ 10-20x
            * shouting ≈ 25-50x
            */
            let multiplier =
                1 + Math.pow(volume * 10, 2);

            return basePoints * multiplier;
        }

        // =========================
        // Microphone Volume Detection
        // =========================

        async function setupMicrophoneLevelDetection() {

            const stream =
                await navigator.mediaDevices.getUserMedia({
                    audio: {
                        noiseSuppression: true,
                        echoCancellation: true,
                        autoGainControl: true
                    }
                });

            const audioContext =
                new (window.AudioContext ||
                window.webkitAudioContext)();

            const source =
                audioContext.createMediaStreamSource(stream);

            const analyser =
                audioContext.createAnalyser();

            analyser.fftSize = 2048;

            source.connect(analyser);

            const dataArray =
                new Uint8Array(analyser.fftSize);

            function monitorVolume() {

                analyser.getByteTimeDomainData(
                    dataArray
                );

                let sumSquares = 0;

                for (
                    let i = 0;
                    i < dataArray.length;
                    i++
                ) {

                    const normalized =
                        (dataArray[i] - 128) / 128;

                    sumSquares +=
                        normalized * normalized;
                }

                const rms =
                    Math.sqrt(
                        sumSquares / dataArray.length
                    );

                currentVolume = rms;

                // Debug volume
                console.log(
                    "Volume:",
                    currentVolume.toFixed(3)
                );

                requestAnimationFrame(
                    monitorVolume
                );
            }

            monitorVolume();
        }

        // =========================
        // Speech Recognition
        // =========================

        function startSpeechRecognition() {

            const SpeechRecognition =
                window.SpeechRecognition ||
                window.webkitSpeechRecognition;

            if (!SpeechRecognition) {

                alert(
                    "Speech Recognition is not supported."
                );

                return;
            }

            const recognition =
                new SpeechRecognition();

            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = "en-US";
            recognition.maxAlternatives = 10;

            const recognitionStatus =
                document.getElementById(
                    "recognitionStatus"
                );

            const speechDetected =
                document.getElementById(
                    "speechDetected"
                );

            const audioDetected =
                document.getElementById(
                    "audioDetected"
                );

            const lastError =
                document.getElementById(
                    "lastError"
                );

            const rawTranscript =
                document.getElementById(
                    "rawTranscript"
                );

            recognition.onstart = () => {

                recognitionStatus.innerText =
                    "Started";

                console.log(
                    "Recognition started"
                );
            };

            recognition.onaudiostart = () => {

                audioDetected.innerText =
                    "YES";

                console.log(
                    "Audio detected"
                );
            };

            recognition.onaudioend = () => {

                audioDetected.innerText =
                    "NO";

                console.log(
                    "Audio ended"
                );
            };

            recognition.onspeechstart = () => {

                speechDetected.innerText =
                    "YES";

                console.log(
                    "Speech detected"
                );
            };

            recognition.onspeechend = () => {

                speechDetected.innerText =
                    "NO";

                console.log(
                    "Speech ended"
                );
            };

            recognition.onresult = (event) => {

                let transcript = "";

                for (
                    let i = event.resultIndex;
                    i < event.results.length;
                    i++
                ) {

                    transcript +=
                        event.results[i][0].transcript +
                        " ";
                }

                transcript =
                    transcript
                        .toLowerCase()
                        .trim();

                rawTranscript.innerText =
                    transcript;

                lastPhrase.innerText =
                    transcript;

                console.log(
                    "Transcript:",
                    transcript
                );

                const normalized =
                    transcript
                        .replace(/[^\w\s]/g, "")
                        .replace(/\s+/g, " ")
                        .trim();

                // No confidence filtering
                // Android frequently returns 0

                if (
                    normalized.includes(
                        "happy birthday"
                    )
                ) {

                    const gain =
                        calculateGain(1);

                    console.log(
                        "Happy Birthday:",
                        gain
                    );

                    updateMeter(gain);
                }

                if (
                    normalized.includes(
                        "i love you"
                    )
                ) {

                    const gain =
                        calculateGain(2);

                    console.log(
                        "I Love You:",
                        gain
                    );

                    updateMeter(gain);
                }
            };

            recognition.onerror = (event) => {

                lastError.innerText =
                    event.error;

                console.error(
                    "Recognition error:",
                    event.error
                );
            };

            recognition.onnomatch = () => {

                console.log(
                    "No speech match"
                );

                lastError.innerText =
                    "No match";
            };

            recognition.onend = () => {

                recognitionStatus.innerText =
                    "Restarting";

                console.log(
                    "Recognition ended"
                );

                setTimeout(() => {

                    try {

                        recognition.start();

                    } catch (e) {

                        console.error(e);
                    }

                }, 300);
            };

            recognition.start();
        }

        // =========================
        // Start Button
        // =========================

        startBtn.addEventListener(
            "click",
            async () => {

                try {

                    startBtn.disabled = true;
                    startBtn.innerText =
                        "🎤 Listening...";

                    await setupMicrophoneLevelDetection();

                    startSpeechRecognition();

                }
                catch (err) {

                    console.error(err);

                    alert(
                        "Could not access microphone."
                    );

                    startBtn.disabled = false;
                    startBtn.innerText =
                        "🎤 Start Listening";
                }
            }
        );
    </script>
</body>
</html>
