<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech Recognition Debug</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

    <h1>🎤 Speech Recognition Debug</h1>

    <button id="startBtn">
        Start Debug Session
    </button>

    <br><br>

    <label>
        <input
            type="checkbox"
            id="enableVolumeMonitor"
            checked
        >
        Enable Volume Monitor
    </label>

    <hr>

    <div class="debug-panel">

        <div><b>Browser:</b></div>
        <div id="browserInfo"></div>

        <br>

        <div><b>Protocol:</b></div>
        <div id="protocolInfo"></div>

        <br>

        <div><b>Language:</b></div>
        <div id="languageInfo"></div>

        <br>

        <div><b>SpeechRecognition:</b></div>
        <div id="speechSupport"></div>

        <br>

        <div><b>Microphone:</b></div>
        <div id="micStatus">Not Started</div>

        <br>

        <div><b>Recognition Status:</b></div>
        <div id="recognitionStatus">Idle</div>

        <br>

        <div><b>Audio Event:</b></div>
        <div id="audioEvent">None</div>

        <br>

        <div><b>Sound Event:</b></div>
        <div id="soundEvent">None</div>

        <br>

        <div><b>Speech Event:</b></div>
        <div id="speechEvent">None</div>

        <br>

        <div><b>Volume:</b></div>
        <div id="volumeValue">0</div>

        <br>

        <div><b>Restart Count:</b></div>
        <div id="restartCount">0</div>

        <br>

        <div><b>Last Error:</b></div>
        <div id="lastError">None</div>

        <br>

        <div><b>Transcript:</b></div>
        <div id="transcriptBox"></div>

        <br>

        <div><b>Raw Results:</b></div>
        <pre id="rawResults"></pre>

    </div>

    <hr>

    <h3>Event Log</h3>

    <div
        id="logPanel"
        style="
            height:250px;
            overflow:auto;
            border:1px solid #ccc;
            padding:5px;
            text-align:left;
            font-size:12px;
        "
    ></div>

</div>

<script>

const startBtn =
    document.getElementById("startBtn");

let restartCounter = 0;

function log(message){

    console.log(message);

    const panel =
        document.getElementById(
            "logPanel"
        );

    const row =
        document.createElement("div");

    row.textContent =
        new Date().toLocaleTimeString()
        + " | "
        + message;

    panel.prepend(row);
}

function setValue(id,value){

    document.getElementById(id)
        .textContent = value;
}

function initializeDiagnostics(){

    setValue(
        "browserInfo",
        navigator.userAgent
    );

    setValue(
        "protocolInfo",
        location.protocol
    );

    setValue(
        "languageInfo",
        navigator.language
    );

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    setValue(
        "speechSupport",
        SpeechRecognition
            ? "SUPPORTED"
            : "NOT SUPPORTED"
    );

    log(
        "Diagnostics initialized"
    );
}

async function setupVolumeMonitor(){

    const stream =
        await navigator.mediaDevices
            .getUserMedia({
                audio:true
            });

    setValue(
        "micStatus",
        "GRANTED"
    );

    const context =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    const source =
        context.createMediaStreamSource(
            stream
        );

    const analyser =
        context.createAnalyser();

    analyser.fftSize = 2048;

    source.connect(analyser);

    const data =
        new Uint8Array(
            analyser.fftSize
        );

    function monitor(){

        analyser.getByteTimeDomainData(
            data
        );

        let sum = 0;

        for(
            let i=0;
            i<data.length;
            i++
        ){

            const sample =
                (data[i]-128)/128;

            sum += sample*sample;
        }

        const rms =
            Math.sqrt(
                sum/data.length
            );

        setValue(
            "volumeValue",
            rms.toFixed(4)
        );

        requestAnimationFrame(
            monitor
        );
    }

    monitor();
}

function startRecognition(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        alert(
            "SpeechRecognition unsupported"
        );

        return;
    }

    const recognition =
        new SpeechRecognition();

    recognition.lang =
        navigator.language;

    recognition.continuous = false;

    recognition.interimResults = true;

    recognition.maxAlternatives = 10;

    log(
        "Language: "
        + recognition.lang
    );

    recognition.onstart = () => {

        setValue(
            "recognitionStatus",
            "STARTED"
        );

        log(
            "Recognition started"
        );
    };

    recognition.onaudiostart = () => {

        setValue(
            "audioEvent",
            "AUDIO START"
        );

        log(
            "Audio start"
        );
    };

    recognition.onaudioend = () => {

        setValue(
            "audioEvent",
            "AUDIO END"
        );

        log(
            "Audio end"
        );
    };

    recognition.onsoundstart = () => {

        setValue(
            "soundEvent",
            "SOUND START"
        );

        log(
            "Sound start"
        );
    };

    recognition.onsoundend = () => {

        setValue(
            "soundEvent",
            "SOUND END"
        );

        log(
            "Sound end"
        );
    };

    recognition.onspeechstart = () => {

        setValue(
            "speechEvent",
            "SPEECH START"
        );

        log(
            "Speech start"
        );
    };

    recognition.onspeechend = () => {

        setValue(
            "speechEvent",
            "SPEECH END"
        );

        log(
            "Speech end"
        );
    };

    recognition.onnomatch = () => {

        log(
            "NO MATCH"
        );

        setValue(
            "lastError",
            "NO MATCH"
        );
    };

    recognition.onerror = (event) => {

        log(
            "ERROR: "
            + event.error
        );

        setValue(
            "lastError",
            event.error
        );
    };

    recognition.onresult = (event) => {

        log(
            "RESULT RECEIVED"
        );

        let transcript = "";

        for(
            let i=0;
            i<event.results.length;
            i++
        ){

            transcript +=
                event.results[i][0]
                    .transcript
                + " ";
        }

        setValue(
            "transcriptBox",
            transcript
        );

        const simplified =
            [];

        for(
            let i=0;
            i<event.results.length;
            i++
        ){

            simplified.push({
                transcript:
                    event.results[i][0]
                        .transcript,
                confidence:
                    event.results[i][0]
                        .confidence,
                final:
                    event.results[i]
                        .isFinal
            });
        }

        document.getElementById(
            "rawResults"
        ).textContent =
            JSON.stringify(
                simplified,
                null,
                2
            );
    };

    recognition.onend = () => {

        restartCounter++;

        setValue(
            "restartCount",
            restartCounter
        );

        setValue(
            "recognitionStatus",
            "RESTARTING"
        );

        log(
            "Recognition ended"
        );

        setTimeout(() => {

            try{

                recognition.start();

            }catch(err){

                log(
                    "Restart failed: "
                    + err.message
                );
            }

        },500);
    };

    recognition.start();
}

startBtn.addEventListener(
    "click",
    async () => {

        try{

            if(
                document.getElementById(
                    "enableVolumeMonitor"
                ).checked
            ){

                await setupVolumeMonitor();
            }

            startRecognition();

        }catch(err){

            log(
                "START ERROR: "
                + err.message
            );
        }
    }
);

initializeDiagnostics();

</script>

</body>
</html>
