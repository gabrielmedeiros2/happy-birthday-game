<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Meter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="container-game" class="container">

    <h1>🎂 Happy Birthday! 🎉</h1>

    <div class="meter-wrapper">
        <div class="meter-label" id="meter-total">&#8369; 8,000</div>
        <div class="meter-area">
            <div class="meter-container">
                <div id="meter-fill"></div>
            </div>
            <div class="meter-tracker" id="meter-tracker">
                <div class="tracker-line"></div>
                <div class="tracker-amount" id="percentage">&#8369; 0</div>
            </div>
        </div>
    </div>

    <div id="turnInfo">
        Coleen's turn
    </div>

    <div id="turnCountdown">
        10s
    </div>

    <div id="boostIndicator">🚀 2X BOOST</div>
    <div id="boostTimer"></div>

    <button id="startBtn">🎤 Start Listening</button>

    <!-- TEST BUTTON - Remove this block when done testing -->
    <button id="testBtn" style="margin-top:6px;background:#9c27b0;">🧪 Test +1000</button>
    <button id="testBoostBtn" style="margin-top:6px;background:#9c27b0;">🧪 Test Boost</button>
    <!-- END TEST BUTTON -->

    <div class="status">
        <p class="text-phrase"><strong>Last phrase:</strong></p>
        <div id="lastPhrase">Waiting...</div>
    </div>

</div>

<div id="container-victory" class="container invisible">
    <div id="victoryMessage">
        <span>🎉 Congratulations, You Won! 🎉</span><br/>
        <span>You children love you so much that the gift is now</span><br/>
        <strong class="victory-amount">10,000&#8369;</strong>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<!-- CELEBRATION AUDIO - Remove this block when done testing -->
<audio id="sndPop" preload="auto">
    <source src="https://raw.githubusercontent.com/Aurosish07/BirthDayCake/master/balloonpop-83760.mp3" type="audio/mpeg">
</audio>
<audio id="sndApplause" preload="auto">
    <source src="https://raw.githubusercontent.com/Sirsha2468/Dev-Geeks/main/Js-Projects/Sound%20Board/sounds/applause.mp3" type="audio/mpeg">
</audio>
<audio id="sndCheer" preload="auto">
    <source src="https://raw.githubusercontent.com/Aurosish07/BirthDayCake/master/song.mp3" type="audio/mpeg">
</audio>
<audio id="sndSuspense" loop preload="auto">
    <source src="https://raw.githubusercontent.com/code4fukui/drumroll/main/569113__missloonervoiceover255__long-snare-drum-roll-with-cymbal-crash.mp3" type="audio/mpeg">
</audio>
<!-- END CELEBRATION AUDIO -->
<script>
const meterFill=document.getElementById("meter-fill");
const percentageText=document.getElementById("percentage");
const meterTracker=document.getElementById("meter-tracker");
const lastPhrase=document.getElementById("lastPhrase");
const startBtn=document.getElementById("startBtn");
const boostIndicator=document.getElementById("boostIndicator");
const boostTimer=document.getElementById("boostTimer");
const volumeDebug=document.getElementById("volumeDebug");
const containerGame=document.getElementById("container-game");
const containerVictory=document.getElementById("container-victory");

const meterMax = 8000;
const totalTurns = 8;
const turnDurationMs = 10000;
const turnCap = meterMax / totalTurns;
const names = ["Coleen", "Leda", "Macmac", "Therese", "Minnie", "Arvin", "Carlou", "Joseph"];

let currentTurn = 1;
let turnTimer = null;
let turnRunning = false;

let meterValue=0;
let recognition=null;
let gameFinished=false;
let currentVolume=0;
let boostActive=false;
let boostTimeout=null;
let boostInterval=null;
let fireworksInterval=null;
let recentVolumes = [];
let simulatedVolume = 0.5;

function formatAmount(val){
    return Math.round(val).toLocaleString("en-US");
}

function updateMeter(amount){
    if(gameFinished) return;
    const turnLimit = getCurrentTurnLimit();
    meterValue += amount;

    if(meterValue > turnLimit){
        meterValue = turnLimit;
        endTurn();
    }

    if(meterValue>=meterMax){
        meterValue=meterMax;
        const pct = (meterValue * 100)/meterMax;
        meterFill.style.height=pct+"%";
        meterTracker.style.bottom=pct+"%";
        percentageText.innerText="\u20B1 " + formatAmount(meterValue);
        setTimeout(triggerVictory, 500);
        return;
    }

    const pct = (meterValue * 100)/meterMax;
    meterFill.style.height=pct+"%";
    meterTracker.style.bottom=pct+"%";
    percentageText.innerText="\u20B1 " + formatAmount(meterValue);
}

function activateBoost(){
    boostActive=true;

    clearTimeout(boostTimeout);
    clearInterval(boostInterval);

    boostIndicator.classList.add("boost-active");
    boostIndicator.style.opacity="1";

    const startTime=Date.now();

    boostInterval=setInterval(()=>{
        const elapsed=Date.now()-startTime;
        const remaining=Math.max(0,30000-elapsed);


        const progress=remaining/30000;
        boostIndicator.style.fontSize=(1+(2*progress))+"rem";
    },100);

    boostTimeout=setTimeout(()=>{
        boostActive=false;
        boostIndicator.style.opacity="0";
        boostIndicator.classList.remove("boost-active");
        clearInterval(boostInterval);
    },30000);
}

async function startVolumeMonitor(){
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});

    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const source=ctx.createMediaStreamSource(stream);
    const analyser=ctx.createAnalyser();

    analyser.fftSize=2048;
    source.connect(analyser);

    const data=new Uint8Array(analyser.fftSize);

    function monitor(){
        analyser.getByteTimeDomainData(data);

        let sum=0;
        for(let i=0;i<data.length;i++){
            const sample=(data[i]-128)/128;
            sum+=sample*sample;
        }

        currentVolume=Math.sqrt(sum/data.length);
        volumeDebug.innerText="Volume: "+currentVolume.toFixed(3);

        if(!gameFinished){
            requestAnimationFrame(monitor);
        }
    }

    monitor();
}

function calculateGain(){
    const baseValue = 100;
    const avgConfidence =
        recentVolumes.length
            ? recentVolumes.reduce(
                (a,b) => a + b,
                0
              ) / recentVolumes.length
            : 0.5;

    let points =
        baseValue +
        (avgConfidence * 300);

    if(boostActive){
        points *= 2;
    }

    return points;
}

function startFireworks(){

    const duration = 3000;

    const end =
        Date.now() +
        duration;

    const interval =
        setInterval(() => {

            confetti({

                particleCount: 50,

                spread: 120,

                origin: {
                    x: 0.5,
                    y: 0.5
                }
            });

            if(
                Date.now() > end
            ){
                clearInterval(
                    interval
                );
            }

        },200);
}

function triggerVictory(){
    gameFinished=true;

    boostActive=false;
    clearTimeout(boostTimeout);
    clearInterval(boostInterval);

    boostIndicator.style.opacity="0";
    boostTimer.innerText="";
    boostIndicator.classList.remove("boost-active");

    if(recognition){
        try{
            recognition.onend=null;
            recognition.stop();
        }catch(e){}
    }

    startBtn.style.display="none";

    containerGame.classList.add("invisible");
    containerVictory.classList.remove("invisible");

    startFireworks();

    document.getElementById("victoryMessage")
            .classList.add("victory-visible");
}

function startRecognition(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

    if(!SR){
        alert("Speech Recognition is not supported.");
        return;
    }

    recognition=new SR();

    recognition.lang="en-US";
    recognition.continuous=false;
    recognition.interimResults=true;

    recognition.onresult=(event)=>{
        let transcript="";

        for(let i=0;i<event.results.length;i++){
            transcript+=event.results[i][0].transcript+" ";
        }

        transcript=transcript.toLowerCase().trim();
        lastPhrase.innerText=transcript;

        const normalized=transcript.replace(/[^\w\s]/g,"").replace(/\s+/g," ").trim();

        const confidence =
            event.results[event.results.length - 1][0]
                .confidence || 0.5;

        simulatedVolume = confidence;

        recentVolumes.push(confidence);

        if(recentVolumes.length > 20){
            recentVolumes.shift();
        }

        if(normalized.includes("i love you")){
            activateBoost();
            return;
        }

        if(normalized.includes("happy birthday")){
            updateMeter(calculateGain());
        }
    };

    recognition.onend=()=>{
        if(gameFinished) return;

        setTimeout(()=>{
            try{ recognition.start(); } catch(e){}
        },300);
    };

    recognition.start();
}

startBtn.addEventListener("click", async ()=>{
    if(turnRunning){
        return;
    }

    try{
        const stream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio:true
                });

        stream.getTracks()
            .forEach(track =>
                track.stop()
            );

        startRecognition();

        startBtn.disabled = true;

        startBtn.innerText =
            "🎤 Listening...";

        document.getElementById(
            "turnCountdown"
        ).innerText =
            "10s";

        startTurn();

    }catch(err){

        alert(
            "Could not access microphone."
        );
    }
});

function getCurrentTurnLimit(){
    return turnCap * currentTurn;
}

function startTurn(){
    turnRunning = true;

    const started =
        Date.now();

    turnTimer =
        setInterval(() => {

            const elapsed =
                Date.now() - started;

            const remaining =
                Math.max(
                    0,
                    turnDurationMs - elapsed
                );

            document.getElementById(
                "turnCountdown"
            ).innerText =
                Math.ceil(
                    remaining / 1000
                ) + "s";

            if(
                remaining <= 0
            ){
                document.getElementById(
                    "turnCountdown"
                ).innerText = "0s";

                clearInterval(
                    turnTimer
                );

                endTurn();
            }

        },100);

    startRecognition();
}

function endTurn(){
    turnRunning = false;

    document.getElementById("turnCountdown").innerText = "0s";

    clearTimeout(turnTimer);
    clearInterval(turnTimer);

    boostActive = false;

    clearTimeout(boostTimeout);
    clearInterval(boostInterval);

    boostIndicator.style.opacity = "0";
    boostTimer.innerText = "";

    boostIndicator.classList.remove(
        "boost-active"
    );

    if(recognition){

        try{

            recognition.onend = null;

            recognition.stop();

        }catch(e){}
    }

    if(currentTurn < totalTurns){

        currentTurn++;

        document.getElementById(
            "turnInfo"
        ).innerText =
            `${names[currentTurn - 1]}'s turn`;

        startBtn.disabled = false;

        startBtn.innerText =
            `🎤 Start ${names[currentTurn - 1]}'s turn`;

    }else{

        startBtn.disabled = false;

        startBtn.innerText =
            "🎤 Final Turn Complete";
    }
}

/* TEST BUTTON - Remove this block when done testing */
document.getElementById("testBtn").addEventListener("click", function(){
    if(gameFinished) return;
    if(!turnRunning){
        turnRunning = true;
        document.getElementById("turnCountdown").innerText = "10s";
    }
    updateMeter(1000);
});

document.getElementById("testBoostBtn").addEventListener("click", function(){
    if(gameFinished) return;
    activateBoost();
});
/* END TEST BUTTON */

/* CELEBRATION AUDIO - Remove this block when done testing */
function playCelebration(){
    var suspense = document.getElementById("sndSuspense");
    suspense.pause();
    suspense.currentTime = 0;
    var pop = document.getElementById("sndPop");
    var applause = document.getElementById("sndApplause");
    var cheer = document.getElementById("sndCheer");
    pop.currentTime = 0; pop.play();
    setTimeout(function(){ applause.currentTime = 0; applause.play(); }, 200);
    setTimeout(function(){ cheer.currentTime = 0; cheer.play(); }, 400);
}

const _origStartFireworks = startFireworks;
startFireworks = function(){
    _origStartFireworks();
    playCelebration();
};

const _origEndTurn = endTurn;
endTurn = function(){
    _origEndTurn();
    if(currentTurn >= 7 && !gameFinished){
        var suspense = document.getElementById("sndSuspense");
        suspense.currentTime = 0;
        suspense.play();
    }
};
/* END CELEBRATION AUDIO */
</script>
</body>
</html>
