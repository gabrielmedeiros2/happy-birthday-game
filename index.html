<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Meter</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

    <h1>🎂 Happy Birthday! 🎉</h1>

    <div class="meter-container">
        <div id="meter-fill"></div>
    </div>

    <div class="percentage" id="percentage">
        0%
    </div>

    <div id="boostIndicator">
        🚀 2X BOOST
    </div>

    <div id="boostTimer"></div>

    <div id="volumeDebug">
        Volume: 0
    </div>

    <button id="startBtn">
        🎤 Start Listening
    </button>

    <div class="status">
        <p><strong>Last phrase:</strong></p>
        <p id="lastPhrase">
            Waiting...
        </p>
    </div>

</div>

<script>

const meterFill =
    document.getElementById(
        "meter-fill"
    );

const percentageText =
    document.getElementById(
        "percentage"
    );

const lastPhrase =
    document.getElementById(
        "lastPhrase"
    );

const startBtn =
    document.getElementById(
        "startBtn"
    );

const boostIndicator =
    document.getElementById(
        "boostIndicator"
    );

const boostTimer =
    document.getElementById(
        "boostTimer"
    );

const volumeDebug =
    document.getElementById(
        "volumeDebug"
    );

let meterValue = 0;

let recognition = null;

let gameFinished = false;

let currentVolume = 0;

let boostActive = false;

let boostTimeout = null;

let boostInterval = null;

// ========================================
// Meter
// ========================================

function updateMeter(amount){

    if(gameFinished){
        return;
    }

    meterValue += amount;

    if(meterValue >= 100){

        meterValue = 100;

        gameFinished = true;

        startBtn.disabled = false;

        startBtn.innerText =
            "🔄 Restart";
    }

    meterFill.style.height =
        meterValue + "%";

    percentageText.innerText =
        Math.round(meterValue) + "%";
}

// ========================================
// Boost
// ========================================

function activateBoost(){

    boostActive = true;

    clearTimeout(boostTimeout);
    clearInterval(boostInterval);

    boostIndicator.classList.add(
        "boost-active"
    );

    boostIndicator.style.opacity =
        "1";

    const startTime =
        Date.now();

    boostInterval =
        setInterval(() => {

            const elapsed =
                Date.now() - startTime;

            const remaining =
                Math.max(
                    0,
                    30000 - elapsed
                );

            const seconds =
                Math.ceil(
                    remaining / 1000
                );

            boostTimer.innerText =
                seconds + "s";

            const progress =
                remaining / 30000;

            const size =
                1 + (2 * progress);

            boostIndicator.style.fontSize =
                size + "rem";

        },100);

    boostTimeout =
        setTimeout(() => {

            boostActive = false;

            boostIndicator.style.opacity =
                "0";

            boostTimer.innerText = "";

            boostIndicator.classList.remove(
                "boost-active"
            );

            clearInterval(
                boostInterval
            );

        },30000);
}

// ========================================
// Volume
// ========================================

async function startVolumeMonitor(){

    const stream =
        await navigator.mediaDevices
            .getUserMedia({
                audio:true
            });

    const audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    const source =
        audioContext
            .createMediaStreamSource(
                stream
            );

    const analyser =
        audioContext
            .createAnalyser();

    analyser.fftSize = 2048;

    source.connect(analyser);

    const dataArray =
        new Uint8Array(
            analyser.fftSize
        );

    function monitor(){

        analyser.getByteTimeDomainData(
            dataArray
        );

        let sum = 0;

        for(
            let i = 0;
            i < dataArray.length;
            i++
        ){

            const sample =
                (dataArray[i]-128)/128;

            sum +=
                sample * sample;
        }

        currentVolume =
            Math.sqrt(
                sum /
                dataArray.length
            );

        volumeDebug.innerText =
            "Volume: " +
            currentVolume.toFixed(3);

        requestAnimationFrame(
            monitor
        );
    }

    monitor();

    stream.getTracks()
        .forEach(track =>
            track.stop()
        );
}

function calculateGain(){

    const noiseFloor = 0.02;

    const volume =
        Math.max(
            0,
            currentVolume -
            noiseFloor
        );

    let points =
        1 +
        Math.pow(
            volume * 20,
            2
        );

    if(boostActive){

        points *= 2;
    }

    return points;
}

// ========================================
// Speech Recognition
// ========================================

function startRecognition(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        alert(
            "Speech Recognition is not supported."
        );

        return;
    }

    recognition =
        new SpeechRecognition();

    recognition.lang = "en-US";

    recognition.continuous = false;

    recognition.interimResults = true;

    recognition.maxAlternatives = 10;

    recognition.onresult = (event) => {

        let transcript = "";

        for(
            let i=0;
            i<event.results.length;
            i++
        ){

            transcript +=
                event.results[i][0]
                    .transcript
                + " ";
        }

        transcript =
            transcript
                .toLowerCase()
                .trim();

        lastPhrase.innerText =
            transcript;

        const normalized =
            transcript
                .replace(/[^\w\s]/g,"")
                .replace(/\s+/g," ")
                .trim();

        if(
            normalized.includes(
                "i love you"
            )
        ){

            activateBoost();

            return;
        }

        if(
            normalized.includes(
                "happy birthday"
            )
        ){

            updateMeter(
                calculateGain()
            );
        }
    };

    recognition.onerror = (event) => {

        console.log(
            event.error
        );
    };

    recognition.onend = () => {

        if(gameFinished){
            return;
        }

        setTimeout(() => {

            try{

                recognition.start();

            }catch(err){

                console.log(err);
            }

        },300);
    };

    recognition.start();
}

// ========================================
// Restart
// ========================================

function restartGame(){

    meterValue = 0;

    gameFinished = false;

    boostActive = false;

    clearTimeout(
        boostTimeout
    );

    clearInterval(
        boostInterval
    );

    boostIndicator.style.opacity =
        "0";

    boostTimer.innerText = "";

    boostIndicator.classList.remove(
        "boost-active"
    );

    meterFill.style.height =
        "0%";

    percentageText.innerText =
        "0%";

    lastPhrase.innerText =
        "Waiting...";

    startBtn.disabled = true;

    startBtn.innerText =
        "🎤 Listening...";

    startRecognition();
}

// ========================================
// Start
// ========================================

startBtn.addEventListener(
    "click",
    async () => {

        if(gameFinished){

            restartGame();

            return;
        }

        try{

            const stream =
                await navigator
                    .mediaDevices
                    .getUserMedia({
                        audio:true
                    });

            stream.getTracks()
                .forEach(track =>
                    track.stop()
                );

            await startVolumeMonitor();

            startRecognition();

            startBtn.disabled = true;

            startBtn.innerText =
                "🎤 Listening...";

        }catch(err){

            console.error(err);

            alert(
                "Could not access microphone."
            );
        }
    }
);

</script>

</body>
</html>
